# Run Prometheus in devops-demo; grant its service account list/watch pods
# in that namespace using the Role below and use port 8080 on each pod.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yaml"]
scrape_configs:
  - job_name: demo-api
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [devops-demo]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: demo-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
# Merge into the existing Prometheus config; keep existing alerting/receivers.
